<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>map-assets · basic example</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; background: #f3f3f1; color: #161616; }
      @media (prefers-color-scheme: dark) { html, body { background: #121212; color: #ededea; } }
      canvas { display: block; }
      .credit { position: fixed; right: 8px; bottom: 6px; opacity: 0.8; }
      #area { position: fixed; left: 12px; top: 12px; font: inherit; padding: 4px 6px; }
      .credit a { color: inherit; }
    </style>
  </head>
  <body>
    <div class="credit">Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> (ODbL)</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
